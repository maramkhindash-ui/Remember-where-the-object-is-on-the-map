  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🗺️ لعبة الخريطة</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }

body {
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  background: linear-gradient(160deg,#FFF9F0,#E8F5E9);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden; user-select: none;
}

/* ── Header ── */
header {
  width:100%; padding:12px 16px;
  background: linear-gradient(135deg,#FF8C42,#FFD93D);
  text-align:center;
  box-shadow: 0 4px 14px rgba(0,0,0,.18);
}
.header-emojis { font-size: clamp(1.6rem,6vw,2.4rem); letter-spacing:4px; }

/* ── Level dots bar ── */
.level-bar {
  display:flex; gap:10px; padding:12px 16px 0; justify-content:center; flex-wrap:wrap;
}
.lv-dot {
  width:44px; height:44px; border-radius:50%;
  font-size:1.3rem; border:3px solid transparent;
  cursor:pointer; transition: transform .2s, box-shadow .2s;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 3px 8px rgba(0,0,0,.15);
}
.lv-dot:disabled { opacity:.35; cursor:default; transform:none; box-shadow:none; }
.lv-dot.active  { border-color:#333; transform:scale(1.18); box-shadow:0 6px 18px rgba(0,0,0,.25); }
.lv-dot:not(:disabled):hover { transform:scale(1.12); }

/* ── Game wrap ── */
.game-wrap {
  width:100%; max-width:820px;
  padding:14px 14px 30px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
}

/* ── Timer bar ── */
.timer-bar-wrap {
  width:100%; height:16px; background:#e0e0e0;
  border-radius:20px; overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.1);
}
.timer-bar {
  height:100%;
  background:linear-gradient(90deg,#66BB6A,#FFD93D,#EF5350);
  border-radius:20px; transition:width .1s linear;
}

/* ── Attempt dots ── */
.attempt-dots {
  display:flex; gap:10px; justify-content:center;
}
.adot {
  width:22px; height:22px; border-radius:50%; background:#ddd;
  transition: background .3s, transform .2s;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}
.adot.done-ok  { background:#66BB6A; transform:scale(1.1); }
.adot.done-bad { background:#EF5350; }
.adot.current  { background:#FF8C42; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

/* ── Map scene ── */
.scene-wrap {
  width:100%; position:relative;
  border-radius:20px; overflow:visible;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  border:5px solid #fff;
}
canvas#bg { display:block; width:100%; height:auto; border-radius:15px; }

/* Emoji items overlay */
.item-layer {
  position:absolute; inset:0; pointer-events:none;
  border-radius:15px;
}
.map-item {
  position:absolute;
  font-size:clamp(2.2rem,7vw,3.2rem);
  transform:translate(-50%,-50%);
  cursor:grab; pointer-events:all;
  transition: filter .15s;
  filter: drop-shadow(2px 4px 4px rgba(0,0,0,.25));
  line-height:1;
}
.map-item:active { cursor:grabbing; filter:drop-shadow(2px 6px 8px rgba(0,0,0,.4)) brightness(1.1); }
.map-item.hidden { display:none; }
.map-item.dragging { z-index:999; pointer-events:none; }

/* Drop hole */
.drop-hole {
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:all;
  cursor:pointer;
}
.hole-ring {
  width:clamp(54px,10vw,80px); height:clamp(54px,10vw,80px);
  border-radius:50%;
  border:4px dashed rgba(255,255,255,.8);
  background:rgba(255,255,255,.18);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(1.4rem,5vw,2rem);
  animation: holeGlow 1.4s ease-in-out infinite;
  transition: background .2s, border-color .2s;
}
.hole-ring.hover-active {
  background:rgba(255,255,255,.5);
  border-color:#FFD93D;
  animation:none;
}
@keyframes holeGlow {
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}
  50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}
}

/* Dragging ghost */
#dragGhost {
  position:fixed; pointer-events:none; z-index:9999;
  font-size:clamp(2.4rem,8vw,3.6rem);
  transform:translate(-50%,-50%);
  filter:drop-shadow(2px 6px 8px rgba(0,0,0,.4));
  display:none;
}

/* ── Tray (items to place) ── */
.tray {
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
  padding:14px; background:rgba(255,255,255,.7);
  border-radius:18px; box-shadow:0 4px 14px rgba(0,0,0,.1);
  width:100%;
}
.tray-item {
  font-size:clamp(2.4rem,9vw,3.8rem);
  cursor:grab; filter:drop-shadow(1px 3px 4px rgba(0,0,0,.2));
  transition:transform .15s, filter .15s;
  padding:6px;
  border-radius:12px;
  border:3px solid transparent;
  background:rgba(255,255,255,.8);
}
.tray-item:not(.placed):active { transform:scale(1.15); cursor:grabbing; }
.tray-item.placed { opacity:.25; cursor:default; filter:none; }
.tray-item.correct-flash { background:#C8E6C9; border-color:#66BB6A; }
.tray-item.wrong-flash   { background:#FFCDD2; border-color:#EF5350; }

/* ── Feedback overlay ── */
#feedbackOverlay {
  display:none; position:fixed; inset:0;
  z-index:500; justify-content:center; align-items:center;
  pointer-events:none;
}
#feedbackOverlay.show { display:flex; }
.feedback-bubble {
  font-size:clamp(5rem,18vw,9rem);
  animation: popBounce .6s ease;
  filter:drop-shadow(2px 6px 10px rgba(0,0,0,.25));
}
@keyframes popBounce {
  0%{transform:scale(0) rotate(-15deg); opacity:0}
  60%{transform:scale(1.2) rotate(5deg)}
  100%{transform:scale(1) rotate(0); opacity:1}
}

/* ── Level complete overlay ── */
#levelOverlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.5); z-index:600;
  justify-content:center; align-items:center;
}
#levelOverlay.show { display:flex; }
.level-card {
  background:#fff; border-radius:28px;
  padding:30px 36px; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:popBounce .5s ease;
  max-width:380px; width:92%;
}
.lc-big { font-size:clamp(4rem,14vw,7rem); }
.lc-stars { font-size:clamp(2rem,8vw,3.5rem); letter-spacing:4px; margin:6px 0; }
.lc-next {
  margin-top:18px;
  font-size:clamp(2rem,7vw,3rem);
  background:linear-gradient(135deg,#FF8C42,#FFD93D);
  border:none; border-radius:50px; padding:14px 40px;
  color:#fff; cursor:pointer; box-shadow:0 5px 18px rgba(255,140,66,.45);
  transition:transform .2s;
}
.lc-next:hover { transform:scale(1.07); }

/* Confetti */
.confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:550; overflow:hidden; }
.confetti-item {
  position:absolute; font-size:clamp(1.5rem,5vw,2.5rem);
  animation:fall linear forwards; top:-60px;
}
@keyframes fall { to{transform:translateY(110vh) rotate(720deg);opacity:0} }
</style>
</head>
<body>

<header>
  <div class="header-emojis">🗺️ 🧩 🌟</div>
</header>

<div class="level-bar" id="levelBar"></div>

<div class="game-wrap">
  <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
  <div class="attempt-dots" id="attemptDots"></div>

  <div class="scene-wrap" id="sceneWrap">
    <canvas id="bg" width="780" height="460"></canvas>
    <div class="item-layer" id="itemLayer"></div>
  </div>

  <div class="tray" id="tray"></div>
</div>

<div id="dragGhost"></div>

<div id="feedbackOverlay">
  <div class="feedback-bubble" id="feedbackBubble"></div>
</div>

<div id="levelOverlay">
  <div class="level-card">
    <div class="lc-big" id="lcBig">🌟</div>
    <div class="lc-stars" id="lcStars">⭐⭐⭐</div>
    <button class="lc-next" id="lcBtn" onclick="nextLevel()">▶</button>
  </div>
</div>
<div class="confetti-wrap" id="confettiWrap"></div>

<script>
// ═══════════════════════════════════════════════
//  SPEECH
// ═══════════════════════════════════════════════
function speak(text, rate=0.88) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ar-SA"; u.rate = rate; u.pitch = 1.15;
  // pick arabic voice if available
  const voices = speechSynthesis.getVoices();
  const ar = voices.find(v => v.lang.startsWith("ar"));
  if (ar) u.voice = ar;
  speechSynthesis.speak(u);
}
// preload voices
window.speechSynthesis && speechSynthesis.getVoices();

// ═══════════════════════════════════════════════
//  LEVELS DATA
//  Each level: studySec, rounds (4 per level), itemsPool
//  Each round hides N items = level number
// ═══════════════════════════════════════════════
// All items with positions on 780×460 canvas
const ALL_ITEMS = [
  { id:"tree",   emoji:"🌳", x:110, y:130 },
  { id:"house",  emoji:"🏠", x:340, y:155 },
  { id:"flower", emoji:"🌸", x:590, y:110 },
  { id:"car",    emoji:"🚗", x:220, y:340 },
  { id:"star",   emoji:"⭐", x:660, y:200 },
  { id:"cat",    emoji:"🐱", x:460, y:310 },
  { id:"sun",    emoji:"☀️", x:130, y:260 },
  { id:"bus",    emoji:"🚌", x:530, y:370 },
];

// Which items are used per level (more items visible on map each level)
const LEVEL_DEFS = [
  { id:1, emoji:"🌱", color:"#A5D6A7", studySec:7,  itemIds:["tree","house","flower"], hideCount:1, rounds:3 },
  { id:2, emoji:"😊", color:"#81D4FA", studySec:9,  itemIds:["tree","house","flower","car"], hideCount:2, rounds:4 },
  { id:3, emoji:"🙂", color:"#FFCC80", studySec:11, itemIds:["tree","house","flower","car","star"], hideCount:3, rounds:4 },
  { id:4, emoji:"😤", color:"#CE93D8", studySec:13, itemIds:["tree","house","flower","car","star","cat"], hideCount:4, rounds:4 },
  { id:5, emoji:"🔥", color:"#EF9A9A", studySec:15, itemIds:["tree","house","flower","car","star","cat","sun","bus"], hideCount:5, rounds:4 },
];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let currentLevelIdx = 0;
let unlockedLevel    = 0;
let currentRound     = 0;  // 0-based within level
let roundScore       = 0;  // correct rounds this level
let phase = "study";       // study | place | result

let hiddenItems = [];      // items to find this round (subset of level items)
let placedCount = 0;

let timerInterval = null;
let studyTimeLeft = 0;

// drag state
let dragging = null;  // { itemId, fromTray: bool }
let dragEl = null;

const canvas = document.getElementById("bg");
const ctx    = canvas.getContext("2d");
const ghost  = document.getElementById("dragGhost");

// ═══════════════════════════════════════════════
//  BUILD LEVEL BAR
// ═══════════════════════════════════════════════
function buildLevelBar() {
  const bar = document.getElementById("levelBar");
  bar.innerHTML = "";
  LEVEL_DEFS.forEach((lv, i) => {
    const btn = document.createElement("button");
    btn.className = "lv-dot" + (i===currentLevelIdx?" active":"");
    btn.style.background = lv.color;
    btn.textContent = lv.emoji;
    btn.disabled = i > unlockedLevel;
    btn.onclick = () => { currentLevelIdx = i; startLevel(); };
    bar.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════
//  DRAW BG MAP
// ═══════════════════════════════════════════════
function drawBg() {
  const W=780, H=460;
  ctx.clearRect(0,0,W,H);
  // Sky
  const sk=ctx.createLinearGradient(0,0,0,H*.5);
  sk.addColorStop(0,"#87CEEB"); sk.addColorStop(1,"#BBDEFB");
  ctx.fillStyle=sk; ctx.fillRect(0,0,W,H*.5);
  // Ground
  const gr=ctx.createLinearGradient(0,H*.5,0,H);
  gr.addColorStop(0,"#8BC34A"); gr.addColorStop(1,"#6A9E3A");
  ctx.fillStyle=gr; ctx.fillRect(0,H*.5,W,H*.5);
  // Road
  ctx.fillStyle="#D2B48C"; ctx.fillRect(0,H*.68,W,36);
  ctx.setLineDash([32,22]); ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,H*.68+18); ctx.lineTo(W,H*.68+18); ctx.stroke();
  ctx.setLineDash([]);
  // River
  ctx.fillStyle="#4FC3F7";
  ctx.beginPath();
  ctx.moveTo(W*.44,0); ctx.lineTo(W*.51,H*.5);
  ctx.lineTo(W*.47,H*.5); ctx.lineTo(W*.40,0);
  ctx.fill();
  // Clouds
  cloud(80,50,65); cloud(480,38,52); cloud(680,52,42);
  // Sun
  ctx.fillStyle="#FFD93D"; ctx.beginPath(); ctx.arc(715,52,35,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#FFF59D"; ctx.beginPath(); ctx.arc(715,52,22,0,Math.PI*2); ctx.fill();
  // Faint grid
  ctx.strokeStyle="rgba(0,0,0,.04)"; ctx.lineWidth=1;
  for(let x=130;x<W;x+=130){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=120;y<H;y+=120){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function cloud(x,y,r){
  ctx.fillStyle="rgba(255,255,255,.82)";
  [[0,0,.6],[r*.5,r*.1,.5],[-r*.4,r*.1,.45],[r*.1,r*.2,.6]].forEach(([dx,dy,s])=>{
    ctx.beginPath(); ctx.arc(x+dx,y+dy,r*s,0,Math.PI*2); ctx.fill();
  });
}

// ═══════════════════════════════════════════════
//  GET ITEM PERCENT POSITION  (relative to canvas)
// ═══════════════════════════════════════════════
function itemPct(item) {
  return { px: item.x/780*100, py: item.y/460*100 };
}

// ═══════════════════════════════════════════════
//  START LEVEL
// ═══════════════════════════════════════════════
function startLevel() {
  buildLevelBar();
  currentRound = 0; roundScore = 0;
  startRound();
}

// ═══════════════════════════════════════════════
//  START ROUND (study phase)
// ═══════════════════════════════════════════════
function startRound() {
  clearInterval(timerInterval);
  phase = "study";
  placedCount = 0;

  const lv = LEVEL_DEFS[currentLevelIdx];
  // pick which items to hide (cycle through combos deterministically)
  const pool = lv.itemIds.map(id => ALL_ITEMS.find(it=>it.id===id));
  // shuffle pool then take hideCount
  const shuffled = [...pool].sort(()=>Math.random()-.5);
  hiddenItems = shuffled.slice(0, lv.hideCount);

  buildAttemptDots();
  drawBg();
  buildItemLayer(true);   // show ALL items
  buildTray([]);           // tray empty during study
  document.getElementById("timerBar").style.width="100%";

  speak("شاهد أين الأشياء!");

  studyTimeLeft = lv.studySec;
  const timerEl = document.getElementById("timerBar");
  timerInterval = setInterval(()=>{
    studyTimeLeft -= .1;
    timerEl.style.width = Math.max(0,studyTimeLeft/lv.studySec*100)+"%";
    if(studyTimeLeft <= 0){ clearInterval(timerInterval); startPlacePhase(); }
  },100);
}

// ═══════════════════════════════════════════════
//  BUILD ITEM LAYER
//  showAll=true  → all items visible
//  showAll=false → hidden items removed, drop holes shown
// ═══════════════════════════════════════════════
function buildItemLayer(showAll) {
  const layer = document.getElementById("itemLayer");
  layer.innerHTML = "";
  const lv   = LEVEL_DEFS[currentLevelIdx];
  const pool = lv.itemIds.map(id => ALL_ITEMS.find(it=>it.id===id));
  const sceneW = layer.offsetWidth || canvas.offsetWidth;
  const sceneH = layer.offsetHeight || canvas.offsetHeight;

  pool.forEach(item => {
    const isHidden = hiddenItems.some(h=>h.id===item.id);
    const {px,py} = itemPct(item);

    if (!showAll && isHidden) {
      // Drop hole
      const hole = document.createElement("div");
      hole.className = "drop-hole";
      hole.id = "hole_"+item.id;
      hole.style.left = px+"%";
      hole.style.top  = py+"%";
      hole.dataset.itemId = item.id;
      const ring = document.createElement("div");
      ring.className = "hole-ring";
      ring.textContent = "❓";
      hole.appendChild(ring);
      layer.appendChild(hole);
    } else {
      // Visible item
      const el = document.createElement("div");
      el.className = "map-item";
      el.id = "mapitem_"+item.id;
      el.style.left = px+"%";
      el.style.top  = py+"%";
      el.textContent = item.emoji;
      layer.appendChild(el);
    }
  });
}

// ═══════════════════════════════════════════════
//  BUILD TRAY
// ═══════════════════════════════════════════════
function buildTray(placedIds) {
  const tray = document.getElementById("tray");
  tray.innerHTML = "";
  hiddenItems.forEach(item => {
    const el = document.createElement("div");
    el.className = "tray-item" + (placedIds.includes(item.id)?" placed":"");
    el.id = "tray_"+item.id;
    el.textContent = item.emoji;
    el.dataset.itemId = item.id;
    if (!placedIds.includes(item.id)) {
      attachDrag(el, item.id);
    }
    tray.appendChild(el);
  });
}

// ═══════════════════════════════════════════════
//  START PLACE PHASE
// ═══════════════════════════════════════════════
function startPlacePhase() {
  phase = "place";
  placedCount = 0;
  document.getElementById("timerBar").style.width="100%";

  drawBg();
  buildItemLayer(false);
  buildTray([]);

  // Attach drop to holes
  document.querySelectorAll(".drop-hole").forEach(hole => {
    hole.addEventListener("mouseup",  e => onDrop(e, hole));
    hole.addEventListener("touchend", e => onDrop(e, hole), {passive:false});
  });

  speak("ضع الأشياء في مكانها!");
}

// ═══════════════════════════════════════════════
//  DRAG (mouse + touch unified)
// ═══════════════════════════════════════════════
function attachDrag(el, itemId) {
  function onStart(e) {
    e.preventDefault();
    if(phase!=="place") return;
    const tEl = document.getElementById("tray_"+itemId);
    if(tEl && tEl.classList.contains("placed")) return;
    dragging = { itemId };
    ghost.textContent = el.textContent;
    ghost.style.display = "block";
    moveGhost(e);
    speak(el.textContent === "🌳"?"شجرة": el.textContent === "🏠"?"بيت":
          el.textContent === "🌸"?"وردة":el.textContent === "🚗"?"سيارة":
          el.textContent === "⭐"?"نجمة":el.textContent === "🐱"?"قطة":
          el.textContent === "☀️"?"شمس":el.textContent === "🚌"?"باص":"شيء", 1.0);
  }
  function onMove(e){ if(dragging) { e.preventDefault(); moveGhost(e); highlightHoles(e); } }
  function onEnd(e) {
    if(!dragging) return;
    e.preventDefault();
    const hole = findHoleUnder(e);
    if(hole) onDrop(e, hole);
    else     cancelDrag();
  }
  el.addEventListener("mousedown",  onStart);
  el.addEventListener("touchstart", onStart, {passive:false});
  document.addEventListener("mousemove", onMove);
  document.addEventListener("touchmove", onMove, {passive:false});
  document.addEventListener("mouseup",  onEnd);
  document.addEventListener("touchend", onEnd, {passive:false});
}

function moveGhost(e) {
  const pt = getPoint(e);
  ghost.style.left = pt.x+"px";
  ghost.style.top  = pt.y+"px";
}

function getPoint(e) {
  if(e.touches && e.touches.length) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  if(e.changedTouches && e.changedTouches.length) return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY };
  return { x:e.clientX, y:e.clientY };
}

function highlightHoles(e) {
  const pt = getPoint(e);
  document.querySelectorAll(".drop-hole").forEach(hole => {
    const r = hole.getBoundingClientRect();
    const over = pt.x>=r.left && pt.x<=r.right && pt.y>=r.top && pt.y<=r.bottom;
    hole.querySelector(".hole-ring").classList.toggle("hover-active", over);
  });
}

function findHoleUnder(e) {
  const pt = getPoint(e);
  for(const hole of document.querySelectorAll(".drop-hole")) {
    const r = hole.getBoundingClientRect();
    if(pt.x>=r.left && pt.x<=r.right && pt.y>=r.top && pt.y<=r.bottom) return hole;
  }
  return null;
}

function cancelDrag() {
  dragging = null;
  ghost.style.display = "none";
  document.querySelectorAll(".hole-ring").forEach(r=>r.classList.remove("hover-active"));
}

// ═══════════════════════════════════════════════
//  ON DROP
// ═══════════════════════════════════════════════
function onDrop(e, hole) {
  if(!dragging || phase!=="place") return;
  e.preventDefault();
  const placedId = dragging.itemId;
  const targetId = hole.dataset.itemId;
  cancelDrag();

  const correct = placedId === targetId;
  showFeedback(correct);

  const trayEl = document.getElementById("tray_"+placedId);

  if(correct) {
    // Replace hole with emoji on map
    hole.innerHTML = "";
    hole.style.pointerEvents = "none";
    const em = document.createElement("div");
    em.style.cssText = "font-size:clamp(2.2rem,7vw,3.2rem);transform:translate(-50%,-50%);filter:drop-shadow(2px 4px 4px rgba(0,0,0,.25));animation:popBounce .4s ease;";
    em.textContent = ALL_ITEMS.find(it=>it.id===targetId).emoji;
    hole.appendChild(em);
    if(trayEl){ trayEl.classList.add("placed","correct-flash"); }
    speak("ممتاز!");
    placedCount++;
    if(placedCount >= hiddenItems.length) {
      setTimeout(roundDone, 900);
    }
  } else {
    if(trayEl){ trayEl.classList.add("wrong-flash"); setTimeout(()=>trayEl.classList.remove("wrong-flash"),700); }
    speak("حاول مرة ثانية!");
  }
}

// ═══════════════════════════════════════════════
//  FEEDBACK EMOJI FLASH
// ═══════════════════════════════════════════════
function showFeedback(correct) {
  const ov = document.getElementById("feedbackOverlay");
  const bb = document.getElementById("feedbackBubble");
  bb.textContent = correct ? "⭐" : "🔄";
  ov.classList.add("show");
  setTimeout(()=>ov.classList.remove("show"), 700);
}

// ═══════════════════════════════════════════════
//  ROUND DONE
// ═══════════════════════════════════════════════
function roundDone() {
  roundScore++;
  updateAttemptDot(currentRound, true);
  currentRound++;
  const lv = LEVEL_DEFS[currentLevelIdx];
  if(currentRound < lv.rounds) {
    setTimeout(startRound, 600);
  } else {
    setTimeout(showLevelResult, 600);
  }
}

// ═══════════════════════════════════════════════
//  LEVEL RESULT
// ═══════════════════════════════════════════════
function showLevelResult() {
  const lv = LEVEL_DEFS[currentLevelIdx];
  const total = lv.rounds;
  const pct   = roundScore / total;
  const stars  = pct===1?"⭐⭐⭐":pct>=.5?"⭐⭐":"⭐";
  const bigEmoji = pct===1?"🏆":pct>=.5?"🌟":"🔄";
  document.getElementById("lcBig").textContent   = bigEmoji;
  document.getElementById("lcStars").textContent = stars;
  document.getElementById("levelOverlay").classList.add("show");
  if(pct>=.5) launchConfetti();
  if(pct===1) speak("ممتاز! أنت بطل!");
  else if(pct>=.5) speak("أحسنت!");
  else speak("حاول مرة ثانية!");
}

function nextLevel() {
  document.getElementById("levelOverlay").classList.remove("show");
  const lv = LEVEL_DEFS[currentLevelIdx];
  const pct = roundScore / lv.rounds;
  if(pct >= .5 && currentLevelIdx < LEVEL_DEFS.length-1) {
    unlockedLevel = Math.max(unlockedLevel, currentLevelIdx+1);
    currentLevelIdx++;
  }
  startLevel();
}

// ═══════════════════════════════════════════════
//  ATTEMPT DOTS
// ═══════════════════════════════════════════════
function buildAttemptDots() {
  const wrap = document.getElementById("attemptDots");
  wrap.innerHTML = "";
  const lv = LEVEL_DEFS[currentLevelIdx];
  for(let i=0;i<lv.rounds;i++){
    const d = document.createElement("div");
    d.className = "adot" + (i===currentRound?" current":"");
    d.id = "adot_"+i;
    wrap.appendChild(d);
  }
}
function updateAttemptDot(idx, ok) {
  const d = document.getElementById("adot_"+idx);
  if(d) d.className = "adot " + (ok?"done-ok":"done-bad");
  const next = document.getElementById("adot_"+(idx+1));
  if(next) next.className = "adot current";
}

// ═══════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════
function launchConfetti() {
  const wrap = document.getElementById("confettiWrap");
  wrap.innerHTML = "";
  ["🌟","🎉","✨","🌈","💫","🎊","⭐","🥳"].forEach((em,_,arr)=>{
    for(let i=0;i<4;i++){
      const el = document.createElement("div");
      el.className = "confetti-item";
      el.textContent = em;
      el.style.left = Math.random()*100+"vw";
      el.style.animationDuration = (1.6+Math.random()*2)+"s";
      el.style.animationDelay    = (Math.random()*.9)+"s";
      wrap.appendChild(el);
      el.addEventListener("animationend",()=>el.remove());
    }
  });
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
drawBg();
buildLevelBar();
startLevel();
</script>
